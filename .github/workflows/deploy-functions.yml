name: Deploy Supabase Functions

# Deploys ONLY the edge functions whose code changed in the push, so a commit
# never overwrites unrelated live functions. A change in _shared/ redeploys the
# functions that import the changed shared file. Each function's verify_jwt
# comes from supabase/config.toml — every function must have an entry there.
#
# Requires the repository secret SUPABASE_ACCESS_TOKEN (Supabase dashboard →
# Account → Access Tokens).

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:
    inputs:
      functions:
        description: 'Space-separated function names to deploy'
        required: true

concurrency:
  group: deploy-functions
  cancel-in-progress: false

env:
  PROJECT_REF: czreiquyyepzqfimrycl

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check access token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Repository secret SUPABASE_ACCESS_TOKEN is missing. Add it in GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Work out which functions changed
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FUNCS="${{ github.event.inputs.functions }}"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then BEFORE="HEAD~1"; fi
            CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- supabase/functions)
            FUNCS=$(echo "$CHANGED" | grep -E '^supabase/functions/[^_/][^/]*/' | cut -d/ -f3 | sort -u)
            for SHARED in $(echo "$CHANGED" | grep -E '^supabase/functions/_shared/' | xargs -r -n1 basename); do
              USERS=$(grep -rl --include='*.ts' "_shared/${SHARED}" supabase/functions | grep -v '/_shared/' | cut -d/ -f3 | sort -u)
              FUNCS="$FUNCS $USERS"
            done
            FUNCS=$(echo $FUNCS | tr ' ' '\n' | sort -u | while read f; do [ -n "$f" ] && [ -d "supabase/functions/$f" ] && echo "$f"; done | tr '\n' ' ')
          fi
          echo "functions=$FUNCS" >> "$GITHUB_OUTPUT"
          echo "Functions to deploy: ${FUNCS:-none}"

      - name: Check every function has its verify_jwt setting
        if: steps.changed.outputs.functions != ''
        run: |
          for f in ${{ steps.changed.outputs.functions }}; do
            grep -q "^\[functions\.$f\]" supabase/config.toml || { echo "::error::supabase/config.toml has no [functions.$f] entry — add verify_jwt before deploying."; exit 1; }
          done

      - uses: supabase/setup-cli@v1
        if: steps.changed.outputs.functions != ''
        with:
          version: 2.122.0

      - name: Deploy
        if: steps.changed.outputs.functions != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for f in ${{ steps.changed.outputs.functions }}; do
            echo "Deploying $f"
            supabase functions deploy "$f" --project-ref "$PROJECT_REF"
          done
